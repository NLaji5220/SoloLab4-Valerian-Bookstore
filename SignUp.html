<!-- Main Body Content Area Information -->
 <div class="container mt-4">
<form id="SignUpForm">
    <div class="mb-3">
        <label for="UsernameInput1" class="form-label"> Username</label>
        <input type="text" class="form-control" id="username" placeholder="Enter Username" onfocusout="validateField(this)">
    </div>
    <div class="mb-3">
        <label for="EmailInput1" class="form-label"> Email</label>
        <input type="email" class="form-control" id="email" placeholder="Enter Email Address" onfocusout="validateEmail()">
    </div>
    <div class="mb-3">
        <label for="PasswordInput1" class="form-label"> Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter Password" onfocusout="validateField(this)">
    </div>
    <div class="mb-3">
        <label for="ConfirmPasswordInput1" class="form-label"> Confirm Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" onfocusout="validatePasswordMatch()">
    </div>
    <button type="submit" class="btn btn-primary w-15"> Sign-Up</button>
</form>
</div>

<!-- Bootstrap JS (optional, but for full Bootstrap functionality) -->
 <script>

function validateField(field) {
    if (field.value.trim() === "") {
        field.classList.add("is-invalid");
    } else {
        field.classList.remove("is-invalid");
    }
}
function validateEmail() {
    let email = document.getElementById("email");
    let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    if (!pattern.test(email.value)) {
        email.classList.add("is-invalid");
    } else {
        email.classList.remove("is-invalid");
    }
}
function validatePasswordMatch() {
    let password = document.getElementById("password");
    let confirmPassword = document.getElementById("confirmPassword");

    if (confirmPassword.value === "" || confirmPassword.value !== password.value) {
        confirmPassword.classList.add("is-invalid");
    } else {
        confirmPassword.classList.remove("is-invalid");
    }
}
document.getElementById("SignUpForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let username = document.getElementById("username");
    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let confirmPassword = document.getElementById("confirmPassword");

    let valid = true;
    let pattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

    // Username
    if (username.value.trim() === "") {
        username.classList.add("is-invalid");
        valid = false;
    } else {
        username.classList.remove("is-invalid");
    }

    // Email
    if (!pattern.test(email.value)) {
        email.classList.add("is-invalid");
        valid = false;
    } else {
        email.classList.remove("is-invalid");
    }

    // Password
    if (password.value.trim() === "") {
        password.classList.add("is-invalid");
        valid = false;
    } else {
        password.classList.remove("is-invalid");
    }

    // Confirm Password
    if (confirmPassword.value === "" || confirmPassword.value !== password.value) {
        confirmPassword.classList.add("is-invalid");
        valid = false;
    } else {
        confirmPassword.classList.remove("is-invalid");
    }

    if (valid) {
        alert("Form submitted successfully!");
    } else {
        alert("Please correct the highlighted fields.");
    }
});
</script>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
